name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --manifest-path windows/Cargo.toml --bin Snowhush
      - uses: actions/upload-artifact@v4
        with:
          name: Snowhush-portable
          path: windows/target/release/Snowhush.exe
